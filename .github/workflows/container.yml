name: Container image (release)

# Publishes the Node.js server's container image (packages/adapters/node/Dockerfile; README.md, Run in a container) to
# ghcr.io/patmmccann/sharedid-edge-node, for linux/amd64 and linux/arm64, with build provenance. Only on a release tag
# (v1.2.3, or a pre-release like v1.2.3-rc.1), pushed by a maintainer: it uses the repository's GITHUB_TOKEN to write
# the package, so it never runs on pull requests. CI (ci.yml, the container job) builds and tests the same Dockerfile
# on every pull request, with no registry.
#
# Tags: the version (1.2.3), and for a release that isn't a pre-release also 1.2 and latest. Images are signed by
# GitHub's artifact attestations: gh attestation verify oci://ghcr.io/patmmccann/sharedid-edge-node:<tag> -R patmmccann/sharedid-edge
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sharedid-edge-node

jobs:
  publish:
    name: Build and push ${{ github.ref_name }}
    if: github.repository == 'patmmccann/sharedid-edge'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=SharedID Edge (Node.js server)
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://github.com/patmmccann/sharedid-edge/blob/main/packages/adapters/node/README.md#run-in-a-container
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/adapters/node/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          provenance: mode=max
          sbom: true
      - name: Attest the build's provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
