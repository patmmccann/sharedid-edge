name: Live tests (AWS)

# Deploys SharedID Edge to this project's AWS test account, a Lambda function behind a real CloudFront distribution,
# and tests it there: the template, origin access control, the headers CloudFront passes (CloudFront-Viewer-*, the
# User-Agent and Client Hints, Origin, Sec-GPC), and unmodified Prebid.js on a page served from the same distribution.
# See packages/adapters/aws-lambda/README.md, Live tests.
#
# It assumes an IAM role through GitHub's OIDC (no long-lived keys), whose ARN is the AWS_E2E_ROLE_ARN repository
# variable; until that's set, it skips. The Lambda@Edge jobs also need the AWS_LAMBDA_EDGE_ENABLED variable set to
# true. It never runs on pull requests (they could come from forks): only from main, on every push (a merged pull
# request), nightly and on demand. CI (ci.yml) stays account-free.
on:
  push:
    branches: [main]
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, since they deploy to the same stacks. A running one finishes; of the runs waiting behind it,
# GitHub keeps only the newest, which tests the latest main.
concurrency:
  group: e2e-aws
  cancel-in-progress: false

jobs:
  not-configured:
    name: AWS live tests aren't set up
    if: github.ref == 'refs/heads/main' && vars.AWS_E2E_ROLE_ARN == ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "::notice::Skipped. Set the AWS_E2E_ROLE_ARN repository variable to run them (packages/adapters/aws-lambda/README.md#live-tests)."

  deploy:
    name: Deploy to CloudFront, verify, conformance
    if: github.ref == 'refs/heads/main' && vars.AWS_E2E_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    outputs:
      site: ${{ steps.deploy.outputs.site }}
      cookie-domain: ${{ steps.deploy.outputs.cookie-domain }}
    env:
      AWS_REGION: ${{ vars.AWS_E2E_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_E2E_ROLE_ARN }}
          role-session-name: sharedid-edge-e2e-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - run: npm ci
      - run: npm run build
      - name: The encrypted-ip test key (the ENCRYPTED_IP_TEST_KEY secret), if set
        env:
          ENCRYPTED_IP_TEST_KEY: ${{ secrets.ENCRYPTED_IP_TEST_KEY }}
        run: |
          if [ -z "$ENCRYPTED_IP_TEST_KEY" ]; then
            echo "::notice::encrypted-ip isn't built in: set the ENCRYPTED_IP_TEST_KEY repository secret to demonstrate it (docs/verification.md, the encrypted-ip row)."
            exit 0
          fi
          # The public key and its recipient only (scripts/encrypted-ip-test-key.mjs); the private key stays in the secret.
          config="$(node scripts/encrypted-ip-test-key.mjs)"
          echo "ENCRYPTED_IP_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Bundle the function, with encrypted-ip when the test key is set
        run: npm run bundle -w @sharedid-edge/aws-lambda ${ENCRYPTED_IP_CONFIG:+-- --module @sharedid-edge/module-encrypted-ip#encryptedIpModule}
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      # The function stacks, the test site's bucket and distribution, the conformance stack, then the site's files.
      # CloudFormation returns once the distributions are deployed; the script waits for the cache invalidation.
      - name: Deploy (packages/adapters/aws-lambda/live/deploy.sh)
        id: deploy
        run: bash packages/adapters/aws-lambda/live/deploy.sh
      - name: verify-deployment
        run: npm run verify-deployment -- --site "${{ steps.deploy.outputs.site }}"
      - name: What CloudFront passes to the function
        run: npx tsx scripts/check-cloudfront.ts --endpoint "${{ steps.deploy.outputs.site }}/platform/_sid" --function-url "${{ steps.deploy.outputs.platform-function-url }}"
      - name: Conformance suite (default-configuration cases) against the live function
        run: node conformance/dist/run.js --base-url "${{ steps.deploy.outputs.conformance }}/_sid"

  browsers:
    name: Prebid.js end to end, live on CloudFront (${{ matrix.browser }})
    needs: deploy
    runs-on: ubuntu-latest
    # Set when its install failed on an apt outage, for the report job's issue (.github/actions/live-issue).
    outputs:
      infrastructure: ${{ steps.browser.outputs.infrastructure }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install the browser and its system dependencies
        id: browser
        uses: ./.github/actions/install-browser
        with:
          browser: ${{ matrix.browser }}
      - name: Unmodified Prebid.js against the test site (${{ matrix.browser }})
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.site }}
          # The distribution's own hostname: cloudfront.net is a public suffix (see the Live tests section).
          E2E_COOKIE_DOMAIN: ${{ needs.deploy.outputs.cookie-domain }}
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-aws-${{ matrix.browser }}
          path: e2e/test-results
          retention-days: 7

  # The live demo's platform copy of the test page, /platform/ on the same distribution, with its endpoint the platform
  # stack's /platform/_sid: ip, geo, ua and bot beside the e2e settings (live/deploy.sh). The main site's /_sid keeps
  # its own settings.
  platform-browsers:
    name: Prebid.js end to end, live on /platform (${{ matrix.browser }})
    needs: deploy
    runs-on: ubuntu-latest
    outputs:
      infrastructure: ${{ steps.browser.outputs.infrastructure }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install the browser and its system dependencies
        id: browser
        uses: ./.github/actions/install-browser
        with:
          browser: ${{ matrix.browser }}
      - name: Unmodified Prebid.js against the test site's /platform/ (${{ matrix.browser }})
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.site }}
          E2E_PATH: /platform
          E2E_COOKIE_DOMAIN: ${{ needs.deploy.outputs.cookie-domain }}
          # ua and bot, with SID_SKIP_BOTS=declared (live/deploy.sh): the device and bot verdict tests.
          E2E_MODULES: ua,bot
          # The encrypted-ip tests decrypt with it; without it (no secret), they skip.
          E2E_EIP_PRIVATE_KEY: ${{ secrets.ENCRYPTED_IP_TEST_KEY }}
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-aws-platform-${{ matrix.browser }}
          path: e2e/test-results
          retention-days: 7

  # GDPR for a real visitor in the EU: the function sharedid-eu-visitor in eu-central-1, which this job deploys first,
  # requests the test site's /_sid and /platform/_sid from a German address (.github/actions/eu-visitor). Required: it
  # runs whenever deploy did, with the same role.
  eu-visitor:
    name: An EU visitor (eu-central-1)
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/eu-visitor
        with:
          role-to-assume: ${{ vars.AWS_E2E_ROLE_ARN }}
          targets: ${{ needs.deploy.outputs.site }}/_sid
          geo-targets: ${{ needs.deploy.outputs.site }}/platform/_sid
          deploy: 'true'

  # Lambda@Edge (README.md, Lambda@Edge): the adapter's functions on the origin-request and viewer-request events of a
  # test site's distribution, deployed by live/deploy-edge.sh. The stacks stay up between runs and a changed bundle
  # publishes a new version, since CloudFront deletes a function's replicas only hours after nothing uses it. It needs
  # more of the role than the jobs above (live/iam-policy.json's Lambda@Edge statements), so it runs only once the
  # AWS_LAMBDA_EDGE_ENABLED repository variable is 'true'; until then it skips with a notice, and main stays green.
  lambda-edge-not-configured:
    name: Lambda@Edge live tests aren't set up
    if: github.ref == 'refs/heads/main' && (vars.AWS_E2E_ROLE_ARN == '' || vars.AWS_LAMBDA_EDGE_ENABLED != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "::notice::Lambda@Edge skipped. Apply live/iam-policy.json's Lambda@Edge statements to the role, then set the AWS_LAMBDA_EDGE_ENABLED repository variable to true (packages/adapters/aws-lambda/README.md#lambdaedge-live-tests)."

  lambda-edge:
    name: Lambda@Edge, deploy, verify, conformance
    if: github.ref == 'refs/heads/main' && vars.AWS_E2E_ROLE_ARN != '' && vars.AWS_LAMBDA_EDGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    # A first deployment deploys the function stacks and the site's distribution twice.
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    outputs:
      site: ${{ steps.deploy.outputs.site }}
      cookie-domain: ${{ steps.deploy.outputs.cookie-domain }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      # Lambda@Edge functions are always in us-east-1.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_E2E_ROLE_ARN }}
          role-session-name: sharedid-edge-e2e-edge-${{ github.run_id }}
          aws-region: us-east-1
      - run: npm ci
      - run: npm run build
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Deploy (packages/adapters/aws-lambda/live/deploy-edge.sh)
        id: deploy
        run: bash packages/adapters/aws-lambda/live/deploy-edge.sh
      - name: verify-deployment
        run: npm run verify-deployment -- --site "${{ steps.deploy.outputs.site }}"
      - name: What CloudFront passes to an origin-request function
        run: npx tsx scripts/check-cloudfront.ts --endpoint "${{ steps.deploy.outputs.site }}/_sid-platform"
      - name: A viewer-request function (no location; GDPR applies without a TC string)
        run: npx tsx scripts/check-cloudfront.ts --endpoint "${{ steps.deploy.outputs.site }}/_sid-viewer" --event viewer-request
      - name: Conformance suite (default-configuration cases) against the live function
        run: node conformance/dist/run.js --base-url "${{ steps.deploy.outputs.conformance }}/_sid"

  lambda-edge-browsers:
    name: Prebid.js end to end, live on Lambda@Edge (${{ matrix.browser }})
    needs: lambda-edge
    runs-on: ubuntu-latest
    # Set when its install failed on an apt outage, for the report job's issue (.github/actions/live-issue).
    outputs:
      infrastructure: ${{ steps.browser.outputs.infrastructure }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install the browser and its system dependencies
        id: browser
        uses: ./.github/actions/install-browser
        with:
          browser: ${{ matrix.browser }}
      - name: Unmodified Prebid.js against the Lambda@Edge test site (${{ matrix.browser }})
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ needs.lambda-edge.outputs.site }}
          E2E_COOKIE_DOMAIN: ${{ needs.lambda-edge.outputs.cookie-domain }}
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-aws-edge-${{ matrix.browser }}
          path: e2e/test-results
          retention-days: 7

  # GDPR for a real visitor in Germany, decided at the edge: CloudFront-Viewer-Country on origin-request (/_sid,
  # /_sid-platform with geo), and on viewer-request, which has no location, GDPR for every visitor without a TC string.
  # The eu-visitor job above deploys the function; this one only invokes it.
  lambda-edge-eu-visitor:
    name: An EU visitor on Lambda@Edge (eu-central-1)
    needs: [lambda-edge, eu-visitor]
    if: ${{ !cancelled() && needs.lambda-edge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/eu-visitor
        with:
          role-to-assume: ${{ vars.AWS_E2E_ROLE_ARN }}
          targets: ${{ needs.lambda-edge.outputs.site }}/_sid ${{ needs.lambda-edge.outputs.site }}/_sid-viewer
          geo-targets: ${{ needs.lambda-edge.outputs.site }}/_sid-platform

  # On main: a failing run after a merge or overnight opens an issue, or comments on the open one, so it isn't missed;
  # a passing run (a merge, overnight, on demand, or a re-run of the failed jobs) closes it. See
  # .github/actions/live-issue.
  # Until AWS_E2E_ROLE_ARN is set, deploy is skipped: nothing was tested, so an open issue stays open. The Lambda@Edge
  # jobs aren't required: skipped until AWS_LAMBDA_EDGE_ENABLED is set, and a failure once they run opens the issue.
  report:
    name: Report the run
    needs: [deploy, browsers, platform-browsers, eu-visitor, lambda-edge, lambda-edge-browsers, lambda-edge-eu-visitor]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts/live-issue.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/live-issue
        with:
          needs: ${{ toJSON(needs) }}
          required: deploy browsers platform-browsers eu-visitor
          title: Live AWS tests are failing
          summary: The live tests on AWS failed
