name: Live tests (AWS)

# Deploys SharedID Edge to this project's AWS test account, a Lambda function behind a real CloudFront distribution,
# and tests it there: the template, origin access control, the headers CloudFront passes (CloudFront-Viewer-*, the
# User-Agent and Client Hints, Origin, Sec-GPC), and unmodified Prebid.js on a page served from the same distribution.
# See packages/adapters/aws-lambda/README.md, Live tests.
#
# It assumes an IAM role through GitHub's OIDC (no long-lived keys), whose ARN is the AWS_E2E_ROLE_ARN repository
# variable; until that's set, it skips. It never runs on pull requests (they could come from forks): only from main,
# on every push (a merged pull request), nightly and on demand. CI (ci.yml) stays account-free.
on:
  push:
    branches: [main]
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, since they deploy to the same stacks. A running one finishes; of the runs waiting behind it,
# GitHub keeps only the newest, which tests the latest main.
concurrency:
  group: e2e-aws
  cancel-in-progress: false

jobs:
  not-configured:
    name: AWS live tests aren't set up
    if: github.ref == 'refs/heads/main' && vars.AWS_E2E_ROLE_ARN == ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "::notice::Skipped. Set the AWS_E2E_ROLE_ARN repository variable to run them (packages/adapters/aws-lambda/README.md#live-tests)."

  deploy:
    name: Deploy to CloudFront, verify, conformance
    if: github.ref == 'refs/heads/main' && vars.AWS_E2E_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    outputs:
      site: ${{ steps.deploy.outputs.site }}
      cookie-domain: ${{ steps.deploy.outputs.cookie-domain }}
    env:
      AWS_REGION: ${{ vars.AWS_E2E_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_E2E_ROLE_ARN }}
          role-session-name: sharedid-edge-e2e-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - run: npm ci
      - run: npm run build
      - run: npm run bundle -w @sharedid-edge/aws-lambda
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      # The function stacks, the test site's bucket and distribution, the conformance stack, then the site's files.
      # CloudFormation returns once the distributions are deployed; the script waits for the cache invalidation.
      - name: Deploy (packages/adapters/aws-lambda/live/deploy.sh)
        id: deploy
        run: bash packages/adapters/aws-lambda/live/deploy.sh
      - name: verify-deployment
        run: npm run verify-deployment -- --site "${{ steps.deploy.outputs.site }}"
      - name: What CloudFront passes to the function
        run: npx tsx scripts/check-cloudfront.ts --endpoint "${{ steps.deploy.outputs.site }}/_sid-platform" --function-url "${{ steps.deploy.outputs.platform-function-url }}"
      - name: Conformance suite (default-configuration cases) against the live function
        run: node conformance/dist/run.js --base-url "${{ steps.deploy.outputs.conformance }}/_sid"

  browsers:
    name: Prebid.js end to end, live on CloudFront (${{ matrix.browser }})
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install the browser and its system dependencies
        working-directory: e2e
        run: ./install-browser.sh ${{ matrix.browser }}
      - name: Unmodified Prebid.js against the test site (${{ matrix.browser }})
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.site }}
          # The distribution's own hostname: cloudfront.net is a public suffix (see the Live tests section).
          E2E_COOKIE_DOMAIN: ${{ needs.deploy.outputs.cookie-domain }}
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-aws-${{ matrix.browser }}
          path: e2e/test-results
          retention-days: 7

  # A failing run after a merge or overnight opens an issue, or comments on the open one, so it isn't missed.
  report:
    name: Report a failing run
    needs: [deploy, browsers]
    if: failure() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name == 'push' && format('after {0}', github.sha) || 'nightly' }}
        run: |
          title="Live AWS tests are failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing ($EVENT): $RUN_URL"
          else
            gh issue create --title "$title" --body "The live tests on AWS failed ($EVENT): $RUN_URL"
          fi
