name: Live tests (Cloudflare)

# Deploys SharedID Edge to this project's test zone (sharedid.dev) and tests it on Cloudflare's real edge: the routes,
# request.cf, the bundle in the real runtime, and unmodified Prebid.js on a page served from the same hostname.
#
# It needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, so it never runs on pull requests
# (they could come from forks): only nightly and on demand, from main. CI (ci.yml) stays account-free.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: they deploy to the same Workers.
concurrency:
  group: e2e-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to sharedid.dev, verify, conformance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: The Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (packages/adapters/cloudflare/README.md#live-tests)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install e2e dependencies, with the latest published Prebid.js
        working-directory: e2e
        run: |
          npm ci
          npm install --no-save prebid.js@latest
          node -e "console.log('Prebid.js', require('./node_modules/prebid.js/package.json').version)"
      - name: Deploy SharedID Edge (the e2e and conformance environments)
        working-directory: packages/adapters/cloudflare
        run: |
          npx wrangler deploy --env e2e
          npx wrangler deploy --env conformance
      - name: Deploy the test site, with Prebid.js
        run: |
          mkdir -p e2e/site/public/prebid/not-for-prod
          cp e2e/node_modules/prebid.js/dist/not-for-prod/prebid.js e2e/site/public/prebid/not-for-prod/
          npx wrangler deploy --config e2e/site/wrangler.jsonc
      - name: Wait for the new version to answer
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null https://e2e.sharedid.dev/ && curl -fsS -o /dev/null https://conformance.sharedid.dev/_sid/v1; then exit 0; fi
            sleep 5
          done
          echo "::error::The test hostnames didn't answer within 150 seconds."
          exit 1
      - name: verify-deployment
        run: npm run verify-deployment -- --site https://e2e.sharedid.dev
      - name: Conformance suite (default-configuration cases) against the live Worker
        run: node conformance/dist/run.js --base-url https://conformance.sharedid.dev/_sid

  browsers:
    name: Prebid.js end to end, live (${{ matrix.browser }})
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install the browser and its system dependencies
        working-directory: e2e
        run: ./install-browser.sh ${{ matrix.browser }}
      - name: Unmodified Prebid.js against https://e2e.sharedid.dev (${{ matrix.browser }})
        working-directory: e2e
        env:
          E2E_BASE_URL: https://e2e.sharedid.dev
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live-${{ matrix.browser }}
          path: e2e/test-results
          retention-days: 7

  # A failing nightly run opens an issue, or comments on the open one, so it isn't missed.
  report:
    name: Report a failing nightly run
    needs: [deploy, browsers]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live Cloudflare tests are failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$title" --body "The nightly live tests on sharedid.dev failed: $RUN_URL"
          fi
