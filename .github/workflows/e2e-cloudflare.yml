name: Live tests (Cloudflare)

# Deploys SharedID Edge to this project's test zone (sharedid.dev) and tests it on Cloudflare's real edge: the routes,
# request.cf, the bundle in the real runtime, and unmodified Prebid.js on a page served from the same hostname.
#
# It needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, so it never runs on pull requests
# (they could come from forks): only from main, on every push (a merged pull request), nightly and on demand.
# CI (ci.yml) stays account-free.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, since they deploy to the same Workers. A running one finishes; of the runs waiting behind it,
# GitHub keeps only the newest, which tests the latest main.
concurrency:
  group: e2e-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to sharedid.dev, verify, conformance
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: The Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (packages/adapters/cloudflare/README.md#live-tests)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Deploy SharedID Edge (the e2e and conformance environments)
        working-directory: packages/adapters/cloudflare
        run: |
          npx wrangler deploy --env e2e
          npx wrangler deploy --env conformance
      - name: Deploy the test site, with its Prebid.js bundle
        run: |
          npm run bundle-prebid --prefix e2e
          npx wrangler deploy --config e2e/site/wrangler.jsonc
      - name: Wait for the new version to answer
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null https://e2e.sharedid.dev/ && curl -fsS -o /dev/null https://e2e.sharedid.dev/demo/ && curl -fsS -o /dev/null https://conformance.sharedid.dev/_sid/v1; then exit 0; fi
            sleep 5
          done
          echo "::error::The test hostnames didn't answer within 150 seconds."
          exit 1
      - name: verify-deployment
        run: npm run verify-deployment -- --site https://e2e.sharedid.dev
      - name: Conformance suite (default-configuration cases) against the live Worker
        run: node conformance/dist/run.js --base-url https://conformance.sharedid.dev/_sid

  browsers:
    name: Prebid.js end to end, live (${{ matrix.browser }})
    needs: deploy
    runs-on: ubuntu-latest
    # Set when its install failed on an apt outage, for the report job's issue (.github/actions/live-issue).
    outputs:
      infrastructure: ${{ steps.browser.outputs.infrastructure }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install the browser and its system dependencies
        id: browser
        uses: ./.github/actions/install-browser
        with:
          browser: ${{ matrix.browser }}
      - name: Unmodified Prebid.js against https://e2e.sharedid.dev (${{ matrix.browser }})
        working-directory: e2e
        env:
          E2E_BASE_URL: https://e2e.sharedid.dev
          # The e2e environment's SID_COOKIE_DOMAIN (packages/adapters/cloudflare/wrangler.jsonc).
          E2E_COOKIE_DOMAIN: sharedid.dev
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live-${{ matrix.browser }}
          path: e2e/test-results
          retention-days: 7

  # The live demo's id5 deployment: a second SharedID Edge Worker, built with the id5 vendor module, on
  # e2e.sharedid.dev/id5/_sid/*, with the e2e settings plus ip, geo and id5 (partner 173, ID5's test partner, against
  # ID5's real API; packages/adapters/cloudflare/live/configs.mjs, id5), and the test page at e2e.sharedid.dev/id5/.
  # Independent of the deploy job: its own Workers, routes and build; the main e2e environment keeps its own.
  id5:
    name: Deploy /id5 (the id5 module, against ID5), check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ID5_SITE: e2e.sharedid.dev
      ID5_ZONE: sharedid.dev
      ID5_PREFIX: /id5
      ID5_COOKIE_DOMAIN: sharedid.dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install e2e dependencies, and the page's Prebid.js bundle
        run: |
          npm ci --prefix e2e
          npm run bundle-prebid --prefix e2e
      - name: Deploy the Worker with id5 and its test page (live/configs.mjs id5)
        working-directory: packages/adapters/cloudflare
        run: |
          node live/configs.mjs id5
          npx wrangler deploy --config live/.out/id5.json
          npx wrangler deploy --config live/.out/id5-site.json
      # The first request waits up to 150 seconds for the new versions to answer.
      - name: The real address and country arrive, forged headers change nothing (scripts/check-live-site.ts)
        run: npx tsx scripts/check-live-site.ts --site "https://$ID5_SITE" --base-path "$ID5_PREFIX/_sid" --cookie-domain "$ID5_COOKIE_DOMAIN" --wait 150
      - name: verify-deployment
        run: npm run verify-deployment -- --site "https://$ID5_SITE" --endpoint "https://$ID5_SITE$ID5_PREFIX/_sid"

  # The browser tests on /id5/, with the ID5 tests on (E2E_MODULES=id5): with consent the ID5 ID from ID5's real API
  # (or ID5's own documented decline), and nothing sent with denied consent or Global Privacy Control.
  id5-browsers:
    name: Prebid.js end to end, live on /id5 (${{ matrix.browser }})
    needs: id5
    runs-on: ubuntu-latest
    outputs:
      infrastructure: ${{ steps.browser.outputs.infrastructure }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Install the browser and its system dependencies
        id: browser
        uses: ./.github/actions/install-browser
        with:
          browser: ${{ matrix.browser }}
      - name: Unmodified Prebid.js against https://e2e.sharedid.dev/id5/ (${{ matrix.browser }})
        working-directory: e2e
        env:
          E2E_BASE_URL: https://e2e.sharedid.dev
          E2E_PATH: /id5
          E2E_COOKIE_DOMAIN: sharedid.dev
          E2E_MODULES: id5
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live-id5-${{ matrix.browser }}
          path: e2e/test-results
          retention-days: 7

  # GDPR for a real visitor in the EU: the function sharedid-eu-visitor in eu-central-1 (deployed by the AWS live tests)
  # requests e2e.sharedid.dev/_sid from a German address (.github/actions/eu-visitor). It needs the AWS live tests'
  # role, AWS_E2E_ROLE_ARN; without it, it's skipped.
  eu-visitor:
    name: An EU visitor (eu-central-1)
    needs: deploy
    if: vars.AWS_E2E_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/eu-visitor
        with:
          role-to-assume: ${{ vars.AWS_E2E_ROLE_ARN }}
          targets: https://e2e.sharedid.dev/_sid

  # On main: a failing run after a merge or overnight opens an issue, or comments on the open one, so it isn't missed;
  # a passing run (a merge, overnight, on demand, or a re-run of the failed jobs) closes it. See
  # .github/actions/live-issue.
  # The EU visitor (eu-visitor) is skipped without the AWS role; the other jobs must pass.
  report:
    name: Report the run
    needs: [deploy, browsers, id5, id5-browsers, eu-visitor]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts/live-issue.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/live-issue
        with:
          needs: ${{ toJSON(needs) }}
          required: deploy browsers id5 id5-browsers
          title: Live Cloudflare tests are failing
          summary: The live tests on sharedid.dev failed
