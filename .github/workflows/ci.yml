name: CI

# Every job runs without secrets or a Cloudflare, AWS or Vercel account, so pull requests from forks get the full checks.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, unit tests, conformance (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: tsconfig.json references every workspace project
        run: npm run check:projects
      - name: Relative links in Markdown files resolve
        run: npm run check:links
      - name: Build and type-check every project, including tests (TypeScript 6.0)
        run: npm run build
      # Typed lint reads the built declarations of the workspace packages, so it runs after the build.
      - name: Lint (typescript-eslint strict type-checked)
        run: npm run lint
      - name: Type-check every project with TypeScript 7
        run: npm run typecheck:ts7
      - name: Type-check the Worker against the Workers runtime types
        run: npm run typecheck:cloudflare
      - name: Worker types match wrangler.jsonc
        run: npm run types:check -w @sharedid-edge/cloudflare
      - name: Unit tests (the Worker's inside workerd)
        run: npm test
      - name: Conformance suite against the Node.js server
        run: npm run conformance
      - name: Published types, as strict consumers see them (each module resolution, TypeScript 6.0 and 7)
        run: npm run consumer-types
      - name: Published types resolve (attw)
        run: npm run attw
      - name: Worker bundle and size budget
        run: |
          npm run build -w @sharedid-edge/cloudflare
          node -e '
            const { readFileSync } = require("node:fs");
            const { gzipSync } = require("node:zlib");
            const gz = gzipSync(readFileSync("packages/adapters/cloudflare/dist/index.js")).length;
            const budget = 20 * 1024;
            console.log(`Worker bundle: ${gz} bytes gzipped (budget ${budget})`);
            if (gz > budget) { console.error("Over the bundle size budget"); process.exit(1); }
          '
      - name: Lambda bundle, size budget, and conformance suite against it (local CloudFront stand-in)
        run: npm run conformance:lambda
      - name: Vercel bundle (no Node.js built-ins), size budget, and conformance suite against it (local Vercel proxy stand-in)
        run: npm run conformance:vercel

  # Vendor modules (packages/vendor-modules/*) are tested in their own job, so one vendor's failing tests don't block
  # changes elsewhere; branch protection can leave this job not required. Their types and lint are still checked in
  # the checks job, with everything else. Succeeds when there are no vendor modules.
  vendor-modules:
    name: Vendor modules (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Each vendor module's tests
        run: npm run test:vendor-modules

  aws-template:
    name: SAM template (cfn-lint, no AWS account)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint packages/adapters/aws-lambda/template.yaml
        run: pipx run --spec 'cfn-lint>=1,<2' cfn-lint packages/adapters/aws-lambda/template.yaml

  conformance-workerd:
    name: Conformance (Workers runtime, wrangler dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Conformance suite against the Worker in workerd
        run: npm run conformance:wrangler
        env:
          WRANGLER_SEND_METRICS: 'false'

  # The browser tests run per browser. Chromium goes first; Firefox and WebKit start only once it passes, so a
  # change that breaks the Prebid.js contract fails fast in one job instead of three.
  e2e-chromium:
    name: Prebid.js end to end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Use the latest published Prebid.js
        # e2e/package.json allows any Prebid.js from 11.48 up; CI tests the newest release, so a Prebid.js change
        # that breaks the pixelUrl contract shows up here rather than in production.
        working-directory: e2e
        run: |
          npm install --no-save prebid.js@latest
          node -e "console.log('Prebid.js', require('./node_modules/prebid.js/package.json').version)"
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install the browser and its system dependencies
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Type-check e2e
        working-directory: e2e
        run: npm run typecheck
      - name: Unmodified Prebid.js sharedIdSystem against SharedID Edge (chromium)
        working-directory: e2e
        run: npx playwright test --project=chromium
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium
          path: e2e/test-results
          retention-days: 7

  e2e:
    name: Prebid.js end to end (${{ matrix.browser }})
    needs: e2e-chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Use the latest published Prebid.js
        # e2e/package.json allows any Prebid.js from 11.48 up; CI tests the newest release, so a Prebid.js change
        # that breaks the pixelUrl contract shows up here rather than in production.
        working-directory: e2e
        run: |
          npm install --no-save prebid.js@latest
          node -e "console.log('Prebid.js', require('./node_modules/prebid.js/package.json').version)"
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install the browser and its system dependencies
        working-directory: e2e
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Type-check e2e
        working-directory: e2e
        run: npm run typecheck
      - name: Unmodified Prebid.js sharedIdSystem against SharedID Edge (${{ matrix.browser }})
        working-directory: e2e
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: e2e/test-results
          retention-days: 7
