name: CI

# Every job runs without secrets or a Cloudflare, AWS, Vercel, Azure, Google Cloud, Akamai or Fastly account, so pull requests from forks get the full
# checks.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, unit tests, conformance (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: tsconfig.json references every workspace project
        run: npm run check:projects
      - name: Relative links in Markdown files resolve
        run: npm run check:links
      - name: Generated doc sections are up to date
        run: npm run check:docs
      # Lists each clone with its file and line pairs; the report is uploaded below when it fails.
      - name: No code copied between packages (jscpd)
        run: npm run check:duplication
      - name: Upload the duplication report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: duplication-report
          path: .jscpd-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Build and type-check every project, including tests (TypeScript 6.0)
        run: npm run build
      # Typed lint reads the built declarations of the workspace packages, so it runs after the build.
      - name: Lint (typescript-eslint strict type-checked)
        run: npm run lint
      - name: Type-check every project with TypeScript 7
        run: npm run typecheck:ts7
      - name: Type-check the Worker against the Workers runtime types
        run: npm run typecheck:cloudflare
      - name: Worker types match wrangler.jsonc
        run: npm run types:check -w @sharedid-edge/cloudflare
      - name: Unit tests (the Worker's inside workerd)
        run: npm test
      - name: Conformance suite against the Node.js server
        run: npm run conformance
      - name: Published types, as strict consumers see them (each module resolution, TypeScript 6.0 and 7)
        run: npm run consumer-types
      - name: Published types resolve (attw)
        run: npm run attw
      # The default build, and the opt-in build with Bowser in the ua module: both must fit the budget.
      - name: Worker bundles (default and with Bowser) and size budget
        run: |
          npm run build -w @sharedid-edge/cloudflare
          npm run build:bowser -w @sharedid-edge/cloudflare
          node scripts/bundle-adapter.mjs packages/adapters/cloudflare/dist/index.js "Worker bundle" \
            packages/adapters/cloudflare/dist-bowser/bowser.js "Worker bundle with Bowser"
      # The Snippet build: the example configuration must fit the 32 KB Snippet limit and pass its smoke test.
      - name: Cloudflare Snippet build (example configuration, size limit and smoke test)
        run: npm run build:snippet -w @sharedid-edge/cloudflare -- --config snippet.config.example.json
      # The Snippet ships settings validated when it's built: it must answer exactly as the Worker, which validates them
      # at run time, and an invalid configuration must fail its build with the Worker's message.
      - name: Cloudflare Snippet against the Worker (same responses; invalid settings fail the build)
        run: npm run test:snippet -w @sharedid-edge/cloudflare
      - name: Lambda bundles (default and with Bowser), size budget, and conformance suite against them (local CloudFront stand-in)
        run: npm run conformance:lambda
      - name: Vercel bundles (default and with Bowser; no Node.js built-ins), size budget, and conformance suite against them (local Vercel proxy stand-in)
        run: npm run conformance:vercel
      - name: Cloud Run function bundle, size budget, and conformance suite against it (the Functions Framework behind a local load balancer stand-in)
        run: npm run conformance:gcp
      - name: Azure Functions bundle, size budget, and conformance suite against it (local Front Door and Functions host stand-in)
        run: npm run conformance:azure
      - name: Akamai EdgeWorker bundles (default and with Bowser; no web or Node.js globals), size budget, and conformance suite against them (local EdgeWorkers stand-in)
        run: npm run conformance:akamai
      # The JavaScript bundles the Fastly Compute package is compiled from, with reusable sandboxes and without (the
      # default, built last); the packages themselves run in the conformance-fastly job.
      - name: Fastly Compute bundles (with reusable sandboxes, and default) and size budget
        run: npm run bundle:reusable -w @sharedid-edge/fastly && npm run bundle -w @sharedid-edge/fastly

  # The real Lambda bundles deployed to AWS Emulator (AWS's open-source local emulator of the AWS APIs; no AWS account,
  # no credentials) and run through its Lambda function URL: see conformance/src/aws-emulator.ts. Not required while it
  # proves stable: the emulator is young and changes often, so its version is pinned (with the package's SHA-256), and
  # moving to a newer one is a deliberate change here.
  lambda-aws-emulator:
    name: Lambda on AWS Emulator (conformance through its function URL; not required yet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      AWS_EMULATOR_VERSION: 1.0.322
      AWS_EMULATOR_SHA256: ef3c75e5d4196bf2c0170b55b75b01e340e0ef497e636b700a1efe68d68a60d7
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache the AWS Emulator package
        uses: actions/cache@v6
        with:
          path: ~/aws-emulator
          key: aws-emulator-${{ env.AWS_EMULATOR_VERSION }}-amd64
      - name: Install AWS Emulator (Debian package, pinned)
        run: |
          deb="$HOME/aws-emulator/aws-emulator_${AWS_EMULATOR_VERSION}-1_amd64.deb"
          if [ ! -f "$deb" ]; then
            mkdir -p "$HOME/aws-emulator"
            curl -fsSLo "$deb" "https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/aws-emulator_${AWS_EMULATOR_VERSION}-1_amd64.deb"
          fi
          echo "$AWS_EMULATOR_SHA256  $deb" | sha256sum -c
          sudo apt-get install -y "$deb" > /dev/null
          aws-emulator -v
      # In the background for the rest of the job, on its default port (127.0.0.1:9297), without telemetry. It writes
      # its endpoint, credentials and certificate to ~/.aws/emulator/9297/, which the target reads.
      - name: Start AWS Emulator
        run: |
          EMULATOR_TELEMETRY=off nohup aws-emulator --idle-timeout 1200 > "$RUNNER_TEMP/aws-emulator.log" 2>&1 &
          for _ in $(seq 60); do
            curl -sf --cacert "$HOME/.aws/emulator/9297/ca.pem" https://127.0.0.1:9297/__admin/health > /dev/null 2>&1 && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/aws-emulator.log"
          exit 1
      - run: npm ci
      - run: npm run build
      - name: Lambda bundles (default, Bowser and vendor modules), deployed to AWS Emulator, and the conformance suite through the function URL
        run: npm run conformance:lambda-aws-emulator
      - name: The emulator's log
        if: failure()
        run: tail -c 30000 "$RUNNER_TEMP/aws-emulator.log"

  # The real Fastly Compute package (the bundle compiled to WebAssembly by Fastly's JavaScript SDK, pinned in
  # packages/adapters/fastly/toolchain/) in Viceroy, Fastly's local runtime: no Fastly account, no credentials. Viceroy
  # is a pinned release binary, checked against its SHA-256. The client IP comes from the connection, so the cases'
  # documentation-range addresses are made local first: conformance/src/fastly-viceroy.ts sends each request from them.
  # Twice, in parallel: the default packages, and the --reusable-sandbox build, where one sandbox answers several
  # requests in turn (fastly-checks.ts checks that it does, and that nothing of one visitor reaches the next).
  conformance-fastly:
    name: Conformance (Fastly Compute package in Viceroy${{ matrix.reusable && ', reusable sandboxes' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        reusable: [false, true]
    env:
      VICEROY_VERSION: 0.22.0
      VICEROY_SHA256: 03f66f27275e8adc0c1857c4f571bd6f5ae997e38cc43760b19c6840a92b298d
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/adapters/fastly/toolchain/package-lock.json
      - name: Cache the Viceroy release
        uses: actions/cache@v6
        with:
          path: ~/viceroy
          key: viceroy-${{ env.VICEROY_VERSION }}-linux-amd64
      - name: Install Viceroy (release binary, pinned)
        run: |
          tgz="$HOME/viceroy/viceroy_v${VICEROY_VERSION}_linux-amd64.tar.gz"
          if [ ! -f "$tgz" ]; then
            mkdir -p "$HOME/viceroy"
            curl -fsSLo "$tgz" "https://github.com/fastly/Viceroy/releases/download/v${VICEROY_VERSION}/viceroy_v${VICEROY_VERSION}_linux-amd64.tar.gz"
          fi
          echo "$VICEROY_SHA256  $tgz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/viceroy"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/viceroy" viceroy
          echo "VICEROY=$RUNNER_TEMP/viceroy/viceroy" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/viceroy/viceroy" --version
      # Requests are sent from the cases' client IPs (192.0.2.77, 2001:db8:1::77, …), which must be local addresses:
      # a local route makes each range deliverable on the loopback interface, and non-local bind lets a socket use
      # any address in it. The ranges are the documentation ones the cases use, plus 203.0.114.0/24, which the cases
      # use as an address the IP database modules don't know.
      - name: Make the cases' client IP ranges local
        run: |
          sudo sysctl -q -w net.ipv4.ip_nonlocal_bind=1 net.ipv6.ip_nonlocal_bind=1
          for range in 192.0.2.0/24 198.51.100.0/24 203.0.113.0/24 203.0.114.0/24; do sudo ip route add local "$range" dev lo; done
          sudo ip -6 route add local 2001:db8::/32 dev lo
      - run: npm ci
      - run: npm run build
      - name: Fastly Compute packages (default, Bowser and vendor modules), sizes, and the conformance suite in Viceroy
        run: npm run ${{ matrix.reusable && 'conformance:fastly:reusable' || 'conformance:fastly' }}

  # Vendor modules (packages/vendor-modules/*) are tested in their own job, so one vendor's failing tests don't block
  # changes elsewhere; branch protection can leave this job not required. Their types and lint are still checked in
  # the checks job, with everything else. Succeeds when there are no vendor modules.
  vendor-modules:
    name: Vendor modules (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Each vendor module's tests
        run: npm run test:vendor-modules

  website:
    name: Website (VitePress build, dead links and anchors fail)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build sharedid.dev from the repository's Markdown
        working-directory: website
        run: |
          npm ci
          npm run build

  aws-template:
    name: SAM template (cfn-lint, no AWS account)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # template.yaml, and the live tests' test site (live/site.yaml; e2e-aws.yml deploys it, never from a pull request).
      - name: Lint packages/adapters/aws-lambda/template.yaml and live/site.yaml
        run: pipx run --spec 'cfn-lint>=1,<2' cfn-lint packages/adapters/aws-lambda/template.yaml packages/adapters/aws-lambda/live/site.yaml

  azure-template:
    name: Bicep templates (az bicep build, no Azure account)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner's Azure CLI builds Bicep offline: no login, no subscription. Warnings are printed; errors fail.
      - name: Build packages/adapters/azure-functions/infra/*.bicep
        run: |
          az bicep install
          az bicep build --file packages/adapters/azure-functions/infra/main.bicep --stdout > /dev/null
          az bicep build --file packages/adapters/azure-functions/infra/frontdoor.bicep --stdout > /dev/null
          az bicep build --file packages/adapters/azure-functions/infra/basepath.bicep --stdout > /dev/null

  gcp-terraform:
    name: Terraform (terraform validate, no Google Cloud account)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # init downloads the providers without a backend or credentials; validate checks the configuration offline.
      - name: Validate packages/adapters/gcp-functions/terraform
        working-directory: packages/adapters/gcp-functions/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  conformance-workerd:
    name: Conformance (Workers runtime, wrangler dev)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Conformance suite against the Worker in workerd
        run: npm run conformance:wrangler
        env:
          WRANGLER_SEND_METRICS: 'false'

  # The browser tests run per browser. Chromium goes first; Firefox and WebKit start only once it passes, so a
  # change that breaks the Prebid.js contract fails fast in one job instead of three.
  e2e-chromium:
    name: Prebid.js end to end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install the browser and its system dependencies
        working-directory: e2e
        run: ./install-browser.sh chromium
      - name: Type-check e2e
        working-directory: e2e
        run: npm run typecheck
      - name: The page's TC string consents to the bundle's modules (e2e/AGENTS.md)
        working-directory: e2e
        run: npm run tc-string -- --check
      - name: Unmodified Prebid.js sharedIdSystem against SharedID Edge (chromium)
        working-directory: e2e
        run: npx playwright test --project=chromium
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chromium
          path: e2e/test-results
          retention-days: 7

  e2e:
    name: Prebid.js end to end (${{ matrix.browser }})
    needs: e2e-chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install the browser and its system dependencies
        working-directory: e2e
        run: ./install-browser.sh ${{ matrix.browser }}
      - name: Type-check e2e
        working-directory: e2e
        run: npm run typecheck
      - name: Unmodified Prebid.js sharedIdSystem against SharedID Edge (${{ matrix.browser }})
        working-directory: e2e
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: e2e/test-results
          retention-days: 7

  # The core browser tests in real Safari, which Playwright can't drive: safaridriver (WebDriver) on a macOS runner, against
  # the same local server, page and Prebid.js bundle. Playwright's WebKit isn't Safari: its cookie timing differs.
  e2e-safari:
    name: Prebid.js end to end (real Safari, macOS)
    needs: e2e-chromium
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci
      - name: Enable safaridriver, and map e2e.sharedid.test to the local server
        run: |
          sw_vers
          echo "Safari $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' /Applications/Safari.app/Contents/Info.plist)"
          sudo safaridriver --enable
          echo "127.0.0.1 e2e.sharedid.test" | sudo tee -a /etc/hosts
      - name: Unmodified Prebid.js sharedIdSystem against SharedID Edge (real Safari)
        working-directory: e2e
        run: npm run test:safari
