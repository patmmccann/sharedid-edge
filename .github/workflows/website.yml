name: Website (sharedid.dev)

# Builds the site from the repository's Markdown (website/) and deploys it to sharedid.dev as a static-assets Worker.
# It needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, so it runs only from main: on every
# merge, and on demand. Pull requests only build the site (ci.yml), without an account.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy sharedid.dev
    # workflow_dispatch can pick any branch; only main is published.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      # For wrangler, which the workspace already has.
      - run: npm ci
      - name: Build the site
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Deploy
        run: npx wrangler deploy --config website/wrangler.jsonc
      - name: The site answers
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null https://sharedid.dev/ && curl -fsS -o /dev/null https://sharedid.dev/adapters/cloudflare; then exit 0; fi
            sleep 5
          done
          echo "::error::https://sharedid.dev didn't answer within 60 seconds."
          exit 1
