# SharedID Edge settings for `gcloud functions deploy --env-vars-file`. Copy it (cp env.example.yaml env.yaml), set
# what you need, and keep the quotes: every value is a string, and empty means the default. A YAML file, unlike
# --set-env-vars, has no trouble with the commas in JSON and lists. Full reference:
# https://github.com/patmmccann/sharedid-edge#configuration-reference
SID_BASE_PATH: "/_sid"
SID_COOKIE_NAME: ""
SID_COOKIE_DOMAIN: "example.com" # required: the domain Prebid.js writes _pubcid on (or host-only)
SID_MAX_AGE_DAYS: ""
SID_CREATE: ""
SID_RECOVERY_COOKIE: ""
SID_OPTOUT_COOKIE: ""
SID_VENDOR_ID: ""
SID_ALLOWED_ORIGINS: ""
SID_SYNC_CACHE_SECONDS: ""
SID_MODULES: ""                # e.g. "ip,geo"
SID_SYNC_MODULES: ""
SID_MODULE_CONFIG: ""          # JSON, e.g. '{"geo":{"precision":"coarse"}}'
SID_MODULE_TIMEOUT_MS: ""
SID_SKIP_BOTS: ""
SID_SKIP_BOTS_SCORE: ""
# SID_MODULE_SECRETS comes from Secret Manager: --set-secrets=SID_MODULE_SECRETS=sid-module-secrets:latest
# Read only by the Google Cloud adapter:
SID_TRUSTED_HOPS: "1"
SID_LOCATION_HEADERS: '{"country":"x-client-region","region":"x-client-region-subdivision","city":"x-client-city","latLong":"x-client-city-lat-long"}'
