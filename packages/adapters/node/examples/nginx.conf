# nginx in front of SharedID Edge's container (docker-compose.yml): README.md's snippet, with the container's name.
server {
    listen 80;
    # A URL over 8 KB reaches SharedID Edge, which answers it (README.md); nginx's default refuses it itself.
    large_client_header_buffers 4 16k;

    # SharedID Edge (README.md, "Deploy behind your proxy").
    location /_sid/ {
        proxy_pass http://sharedid:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, don't append: the server takes the first entry
        proxy_cache off;
    }

    # Your site.
    location / {
        root /usr/share/nginx/html;
    }
}
