AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SharedID Edge's live test of the Node.js server's container image as an upstream operator's endpoint, in
  trusted-upstream mode, behind a publisher's Cloudflare Worker (packages/adapters/node/README.md, Live tests). Two
  Lambda functions from the image (with AWS Lambda Web Adapter, live/Dockerfile.lambda), each with a public function
  URL: the browser tests' settings, and the default settings for the conformance suite. Not for deployers.

Parameters:
  ImageUri:
    Type: String
    Description: The image in ECR (<account>.dkr.ecr.<region>.amazonaws.com/sharedid-node-upstream:<commit>).
  UpstreamSecrets:
    Type: String
    NoEcho: true
    Description: SID_UPSTREAM_SECRETS, a JSON array with the publisher Worker's shared secret.
  BasePath:
    Type: String
    Default: /node-upstream/_sid
    Description: SID_BASE_PATH of the browser tests' endpoint (the publisher forwards the path as it is).
  ConformanceBasePath:
    Type: String
    Default: /node-upstream-conformance/_sid
    Description: SID_BASE_PATH of the default-settings endpoint.
  Hosts:
    Type: String
    Description: SID_HOSTS of the browser tests' endpoint (the publisher's hostname and its settings, JSON).

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # The upstream operator's endpoint as docs/upstream-operators.md describes it: trusted-upstream mode, the publisher
  # recipes' header names, and the publisher's site in SID_HOSTS.
  Endpoint:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref AWS::StackName
      PackageType: Image
      Code: { ImageUri: !Ref ImageUri }
      Role: !GetAtt Role.Arn
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          SID_UPSTREAM_SECRETS: !Ref UpstreamSecrets
          SID_CLIENT_IP_HEADER: x-sid-client-ip
          SID_LOCATION_HEADERS: '{"country":"x-sid-country","regionCode":"x-sid-region"}'
          SID_BASE_PATH: !Ref BasePath
          SID_COOKIE_DOMAIN: host-only
          SID_MODULES: ip,geo,reflect,clickid
          SID_HOSTS: !Ref Hosts

  # The same image on the default settings (host-only cookies, no modules), for the conformance suite's default cases.
  ConformanceEndpoint:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-conformance'
      PackageType: Image
      Code: { ImageUri: !Ref ImageUri }
      Role: !GetAtt Role.Arn
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          SID_UPSTREAM_SECRETS: !Ref UpstreamSecrets
          SID_CLIENT_IP_HEADER: x-sid-client-ip
          SID_LOCATION_HEADERS: '{"country":"x-sid-country","regionCode":"x-sid-region"}'
          SID_BASE_PATH: !Ref ConformanceBasePath
          SID_COOKIE_DOMAIN: host-only

  # Public function URLs: anyone may call them, and the endpoint answers 403 without the shared secret.
  EndpointUrl:
    Type: AWS::Lambda::Url
    Properties: { TargetFunctionArn: !Ref Endpoint, AuthType: NONE }
  EndpointUrlPermission:
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref Endpoint, Action: lambda:InvokeFunctionUrl, Principal: '*', FunctionUrlAuthType: NONE }
  EndpointInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref Endpoint, Action: lambda:InvokeFunction, Principal: '*', InvokedViaFunctionUrl: true }
  ConformanceUrl:
    Type: AWS::Lambda::Url
    Properties: { TargetFunctionArn: !Ref ConformanceEndpoint, AuthType: NONE }
  ConformanceUrlPermission:
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref ConformanceEndpoint, Action: lambda:InvokeFunctionUrl, Principal: '*', FunctionUrlAuthType: NONE }
  ConformanceInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: { FunctionName: !Ref ConformanceEndpoint, Action: lambda:InvokeFunction, Principal: '*', InvokedViaFunctionUrl: true }

  # Kept for two weeks: the server logs only its start-up line and errors, never requests.
  EndpointLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/aws/lambda/${Endpoint}', RetentionInDays: 14 }
  ConformanceLogs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub '/aws/lambda/${ConformanceEndpoint}', RetentionInDays: 14 }

Outputs:
  EndpointUrl:
    Value: !GetAtt EndpointUrl.FunctionUrl
  ConformanceUrl:
    Value: !GetAtt ConformanceUrl.FunctionUrl
