<!doctype html>
<html><head><title>SharedID Edge e2e</title>
<script>window.pbjs = window.pbjs || { que: [] };</script>
<script src="/prebid/prebid.js"></script>
<script>
  pbjs.que.push(function () {
    pbjs.setConfig({
      // Until the pinned Prebid.js has prebid/Prebid.js#16156, storageControl blocks the probe cookie sharedIdSystem uses
      // to find the registrable domain, so _pubcid would be host-only. Remove this with the first release that has it.
      storageControl: { enforcement: 'off' },
      userSync: {
        syncDelay: 0,
        userIds: [{
          name: 'sharedId',
          params: { pixelUrl: '/_sid/sync', extend: true },
          storage: { type: 'cookie', name: '_pubcid', expires: 365 }
        }]
      }
    });
  });
</script>
</head><body>SharedID Edge e2e</body></html>
