<!doctype html>
<html><head><meta charset="utf-8"><title>SharedID Edge e2e</title>
<!-- Scripts are relative to the page, so it works under a path prefix too (E2E_PATH). GDPR applies, with a fixed TC string: tcf.js, generated by e2e/tc-string.ts (see e2e/AGENTS.md). -->
<script src="tcf.js"></script>
<!-- GPP, with ?gpp=<name> only: gpp.js. -->
<script src="gpp.js"></script>
<!-- A stand-in ID vendor tag writing uid1, before Prebid.js (see vendor-uid1.js; ?vendor=late runs it after). -->
<script src="vendor-uid1.js"></script>
<!-- The results panel a person sees (results.js): before Prebid.js, so it knows whether _pubcid was already there. -->
<script src="results.js"></script>
<script>window.pbjs = window.pbjs || { que: [] };</script>
<script src="prebid/prebid.js"></script>
<script>
  pbjs.que.push(function () {
    var consentManagement = {};
    if (window.SID_E2E_TCF) consentManagement.gdpr = { cmpApi: 'static', consentData: { getTCData: window.SID_E2E_TCF } };
    if (window.SID_E2E_GPP) consentManagement.gpp = { cmpApi: 'static', consentData: window.SID_E2E_GPP };
    // No consentManagement at all without a CMP (?consent=none and no ?gpp): an empty one would wait for a TCF CMP.
    if (consentManagement.gdpr || consentManagement.gpp) pbjs.setConfig({ consentManagement: consentManagement });
    pbjs.setConfig({
      userSync: {
        syncDelay: 0,
        userIds: [{
          name: 'sharedId',
          // pixelUrl is _sid/sync beside the page: /_sid/sync on the site's root, /<prefix>/_sid/sync on a live setup that
          // shares its hostname (E2E_PATH in the tests). pixelConsent (Prebid.js 11.53+) sends the page's consent to
          // pixelUrl; ?pixelConsent=off leaves it out, so the endpoint reads the TC string from euconsent-v2 only, as with
          // earlier Prebid.js versions. ?pixelCookieDomain=1 adds pixelCookieDomain (Prebid.js 11.53+), for
          // SID_COOKIE_DOMAIN=auto (tests/cookie-domain-auto.spec.ts).
          params: Object.assign(
            { pixelUrl: location.pathname.replace(/[^/]*$/, '') + '_sid/sync', extend: true, pixelConsent: new URLSearchParams(location.search).get('pixelConsent') !== 'off' },
            new URLSearchParams(location.search).get('pixelCookieDomain') === '1' ? { pixelCookieDomain: true } : {}
          ),
          storage: { type: 'cookie', name: '_pubcid', expires: 365 }
        }]
      }
    });
  });
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head><body>SharedID Edge e2e</body></html>
